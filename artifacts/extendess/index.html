<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Extendess Beauty Salon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      [data-replit-badge],
      #replit-badge,
      .replit-badge,
      #replit-badge-container,
      iframe[src*="replit.com/badge"],
      a[href*="replit.com"][target="_blank"]:has(img[src*="replit"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        function removeReplitBadge() {
          var selectors = [
            '[data-replit-badge]',
            '#replit-badge',
            '#replit-badge-container',
            '.replit-badge',
            'iframe[src*="replit.com/badge"]'
          ];
          selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) { el.remove(); });
          });
        }
        var observer = new MutationObserver(removeReplitBadge);
        document.addEventListener('DOMContentLoaded', function() {
          removeReplitBadge();
          observer.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
